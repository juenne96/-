<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🌈字字乐园 PRO</title>

  <link rel="stylesheet" href="style.css" />
  <script defer src="app.js"></script>
</head>

<body>
  <header class="top-bar">
    <h1>🌈 字字乐园 PRO</h1>
    <p>汉字学习 · 游戏 · 朗读系统</p>
  </header>

  <main class="container">

    <section class="card">
      <h2>📚 学习模式</h2>
      <button onclick="startLearn()">开始学习</button>
    </section>

    <section class="card">
      <h2>🎮 游戏模式</h2>
      <button onclick="startGame()">开始游戏</button>
    </section>

    <section class="card">
      <h2>🧠 测试模式</h2>
      <button onclick="startTest()">开始测试</button>
    </section>

    <section class="panel">
      <h2>📌 当前内容</h2>
      <div id="output">请选择一个模式开始</div>
    </section>

  </main>

  <footer class="footer">
    <p>© 2026 字字乐园 PRO</p>
  </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字字乐园 PRO</title>

<style>
body{
  margin:0;
  font-family:"Arial";
  background:#fff8ee;
}

/* 顶部 */
header{
  background:linear-gradient(135deg,#ffb6c1,#ffd580);
  color:white;
  text-align:center;
  padding:18px;
  font-size:22px;
  font-weight:bold;
}

/* 星星 */
#info{
  text-align:center;
  padding:10px;
  font-size:15px;
}

/* 页面 */
.page{display:none;padding:12px;}
.active{display:block;}

/* 卡片（儿童风） */
.card{
  background:white;
  border-radius:22px;
  padding:18px;
  margin:10px 0;
  text-align:center;
  box-shadow:0 5px 12px rgba(0,0,0,0.1);
}

/* 按钮（圆润儿童风） */
button{
  padding:10px 14px;
  margin:5px;
  border:none;
  border-radius:15px;
  background:#ff9f80;
  color:white;
  font-size:14px;
}

/* 汉字 */
.word{
  font-size:45px;
  margin:10px;
}

/* 图片 */
img{
  width:150px;
  height:150px;
  object-fit:cover;
  border-radius:18px;
}

/* 底部导航 */
.nav{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  background:white;
  border-top:1px solid #eee;
}

.nav div{
  flex:1;
  text-align:center;
  padding:10px;
  font-size:13px;
}
</style>
</head>

<body>

<header>🌈 字字乐园 PRO</header>

<div id="info">
⭐ 星星：<span id="score">0</span>
</div>

<!-- 🏠 首页 -->
<div id="home" class="page active">
  <div class="card">
    <h3>📚 学习入口</h3>
    <button onclick="openLearn()">进入学习</button>
  </div>

  <div class="card">
    <h3>🎮 趣味闯关</h3>
    <button onclick="show('game1')">看图选词</button>
    <button onclick="show('game2')">听读选词</button>
  </div>
</div>

<!-- 📚 学习（范读+跟读+朗读+笔顺） -->
<div id="learn" class="page">
  <div class="card">
    <div class="word" id="char">猫</div>

    <img id="img">

    <div>
      <button onclick="fandou()">📢 范读</button>
      <button onclick="langdu()">🔊 朗读</button>
      <button onclick="gendu()">👂 跟读</button>
    </div>

    <div>
      <button onclick="nextWord()">下一个</button>
    </div>
  </div>

  <div class="card">
    <h3>✍️ 笔顺练习</h3>
    <div id="stroke" style="font-size:70px;opacity:0.3;">猫</div>
    <button onclick="writeAnim()">播放笔顺</button>
  </div>
</div>

<!-- 🎮 看图选词 -->
<div id="game1" class="page">
  <div class="card">
    <h3>🖼 看图选词</h3>
    <img id="gimg">
    <div id="gopt"></div>
  </div>
</div>

<!-- 🎧 听读选词 -->
<div id="game2" class="page">
  <div class="card">
    <h3>🔊 听读选词</h3>
    <button onclick="playAudio()">▶ 播放</button>
    <div id="aopt"></div>
  </div>
</div>

<script>

let score = localStorage.getItem("score") || 0;
document.getElementById("score").innerText = score;

/* 数据（可扩展） */
const data=[
  {w:"猫",img:"https://cdn-icons-png.flaticon.com/512/616/616430.png"},
  {w:"狗",img:"https://cdn-icons-png.flaticon.com/512/616/616408.png"},
  {w:"鱼",img:"https://cdn-icons-png.flaticon.com/512/616/616547.png"}
];

let i=0;

/* 页面切换 */
function show(p){
  document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
  document.getElementById(p).classList.add("active");
}

/* 进入学习 */
function openLearn(){
  show('learn');
  loadLearn();
}

/* 学习 */
function loadLearn(){
  document.getElementById("char").innerText=data[i].w;
  document.getElementById("img").src=data[i].img;
}

/* 范读 */
function fandou(){
  let msg=new SpeechSynthesisUtterance("请跟我读：" + data[i].w);
  msg.lang="zh-CN";
  speechSynthesis.speak(msg);
}

/* 朗读 */
function langdu(){
  let msg=new SpeechSynthesisUtterance(data[i].w);
  msg.lang="zh-CN";
  speechSynthesis.speak(msg);
}

/* 跟读 */
function gendu(){
  let msg=new SpeechSynthesisUtterance("你来读：" + data[i].w);
  msg.lang="zh-CN";
  speechSynthesis.speak(msg);
}

/* 下一个 */
function nextWord(){
  i++;
  if(i>=data.length) i=0;
  loadLearn();
}

/* ✍️ 笔顺动画（简化版） */
function writeAnim(){
  let el=document.getElementById("stroke");
  el.innerText=data[i].w;
  el.style.transition="0.3s";
  el.style.opacity="1";
  setTimeout(()=>el.style.opacity="0.3",1000);
}

/* 🖼 看图选词 */
function loadGame1(){
  let q=data[Math.floor(Math.random()*data.length)];
  document.getElementById("gimg").src=q.img;

  let opt=[q.w,"苹果","车","树"];

  let html="";
  opt.forEach(o=>{
    html+=`<button onclick="checkGame1('${o}','${q.w}')">${o}</button>`;
  });

  document.getElementById("gopt").innerHTML=html;
}
loadGame1();

function checkGame1(a,ans){
  if(a===ans){
    alert("✔️ 正确");
    add();
  }else alert("❌");
  loadGame1();
}

/* 🎧 听读选词 */
let audioWord=data[0].w;

function playAudio(){
  let msg=new SpeechSynthesisUtterance(audioWord);
  msg.lang="zh-CN";
  speechSynthesis.speak(msg);

  let opt=[audioWord,"猫","狗","鱼"];
  let html="";
  opt.forEach(o=>{
    html+=`<button onclick="checkAudio('${o}')">${o}</button>`;
  });

  document.getElementById("aopt").innerHTML=html;
}

function checkAudio(a){
  if(a===audioWord){
    alert("✔️ 正确");
    add();
  }else alert("❌");
  audioWord=data[Math.floor(Math.random()*data.length)].w;
}

/* ⭐ 加分 */
function add(){
  score++;
  localStorage.setItem("score",score);
  document.getElementById("score").innerText=score;
}

</script>

<!-- 自动初始化 -->
<script>
loadGame1();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字字乐园</title>

<link rel="manifest" href="manifest.json">

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(#fff7e6,#e6f0ff);
  overflow:hidden;
}

/* 顶部 */
header{
  text-align:center;
  padding:12px;
  background:linear-gradient(135deg,#ffb6c1,#ffd580);
  color:white;
  font-size:18px;
}

/* HUD */
#hud{
  text-align:center;
  padding:8px;
  font-size:14px;
}

/* 世界地图 */
.world{
  position:relative;
  height:85vh;
}

/* 路径动画 */
.path{
  position:absolute;
  width:3px;
  height:100%;
  background:rgba(255,153,102,0.3);
  left:50%;
  animation:flow 3s infinite linear;
}

@keyframes flow{
  0%{opacity:0.2;}
  50%{opacity:1;}
  100%{opacity:0.2;}
}

/* 节点 */
.node{
  width:110px;
  height:110px;
  border-radius:50%;
  position:absolute;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 5px 12px rgba(0,0,0,0.2);
  transition:0.3s;
}

.node:active{
  transform:scale(0.9);
}

/* 状态 */
.open{
  background:linear-gradient(135deg,#ffcc66,#ff9966);
  color:white;
  animation:pulse 2s infinite;
}

.locked{
  background:#ccc;
  color:#777;
}

.done{
  background:#4caf50;
  color:white;
}

/* 动画 */
@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.05);}
  100%{transform:scale(1);}
}

/* 位置（地图路线） */
#n0{top:60%;left:10%;}
#n1{top:30%;left:40%;}
#n2{top:60%;left:70%;}

/* 游戏页 */
#game{
  display:none;
  padding:15px;
}

.card{
  background:white;
  padding:20px;
  border-radius:20px;
  text-align:center;
  margin-top:20px;
}

button{
  padding:10px 15px;
  margin:5px;
  border:none;
  border-radius:12px;
  background:#ff9966;
  color:white;
}

img{
  width:130px;
  height:130px;
  border-radius:12px;
}

/* 入场动画 */
.fadeIn{
  animation:fade 0.5s ease;
}

@keyframes fade{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}
</style>
</head>

<body>

<header>🌈 字字乐园｜学习世界</header>

<div id="hud">
⭐ 星星：<span id="score">0</span>
</div>

<!-- 🌍 世界地图 -->
<div id="world" class="world">

  <div class="path"></div>

  <div class="node open" id="n0" onclick="enter(0)">
    👨‍👩‍👧<br>人物
  </div>

  <div class="node locked" id="n1" onclick="enter(1)">
    🐾<br>动物
  </div>

  <div class="node locked" id="n2" onclick="enter(2)">
    🧠<br>身体
  </div>

</div>

<!-- 🎮 游戏 -->
<div id="game">

  <div class="card fadeIn">
    <h3 id="title"></h3>

    <img id="img">

    <div id="options"></div>

    <button onclick="back()">返回地图</button>
  </div>

</div>

<script>

/* PWA注册 */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('service-worker.js');
}

/* 数据 */
const data=[
  {
    name:"人物",
    items:[
      {w:"爸爸",img:"https://cdn-icons-png.flaticon.com/512/2922/2922510.png"},
      {w:"妈妈",img:"https://cdn-icons-png.flaticon.com/512/2922/2922561.png"}
    ]
  },
  {
    name:"动物",
    items:[
      {w:"猫",img:"https://cdn-icons-png.flaticon.com/512/616/616430.png"},
      {w:"狗",img:"https://cdn-icons-png.flaticon.com/512/616/616408.png"}
    ]
  },
  {
    name:"身体",
    items:[
      {w:"头",img:"https://cdn-icons-png.flaticon.com/512/4140/4140048.png"},
      {w:"手",img:"https://cdn-icons-png.flaticon.com/512/709/709594.png"}
    ]
  }
];

let cur=0;
let idx=0;

let score=localStorage.getItem("score")||0;
document.getElementById("score").innerText=score;

/* 进入关卡 */
function enter(i){
  cur=i;
  idx=0;

  document.getElementById("world").style.display="none";
  document.getElementById("game").style.display="block";

  load();
}

/* 加载 */
function load(){
  let q=data[cur].items[idx];

  document.getElementById("title").innerText=data[cur].name;
  document.getElementById("img").src=q.img;

  let opt=[q.w,"苹果","车","树"];

  let html="";
  opt.forEach(o=>{
    html+=`<button onclick="check('${o}')">${o}</button>`;
  });

  document.getElementById("options").innerHTML=html;
}

/* 答题 */
function check(a){
  let q=data[cur].items[idx];

  if(a===q.w){
    score++;
    localStorage.setItem("score",score);
    document.getElementById("score").innerText=score;

    idx++;

    if(idx>=data[cur].items.length){
      unlock();
      alert("🎉 通关！");
      back();
      return;
    }
  }

  load();
}

/* 解锁 */
function unlock(){
  let node=document.getElementById("n"+cur);
  node.classList.remove("open");
  node.classList.add("done");

  let next=document.getElementById("n"+(cur+1));
  if(next){
    next.classList.remove("locked");
    next.classList.add("open");
  }
}

/* 返回 */
function back(){
  document.getElementById("game").style.display="none";
  document.getElementById("world").style.display="block";
}

</script>

</body>
</html>

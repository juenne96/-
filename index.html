<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字字乐园｜笔顺练习</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f5f7ff;
}

header{
  background:linear-gradient(135deg,#ffcc66,#ff9966);
  color:white;
  text-align:center;
  padding:18px;
  font-size:20px;
  font-weight:bold;
}

#info{
  text-align:center;
  margin:10px;
  font-size:16px;
}

.card{
  background:white;
  margin:15px;
  padding:25px;
  border-radius:20px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
  text-align:center;
}

/* 汉字显示 */
.char{
  font-size:120px;
  margin:20px;
  color:#333;
  position:relative;
}

/* 笔画动画层 */
.stroke{
  position:absolute;
  width:100%;
  height:100%;
  top:0;
  left:0;
  font-size:120px;
  color:rgba(255,153,102,0.3);
  animation:write 2s linear forwards;
}

/* 写字动画 */
@keyframes write{
  0%{clip-path: inset(0 100% 0 0);}
  100%{clip-path: inset(0 0 0 0);}
}

/* 按钮 */
button{
  padding:12px 18px;
  margin:8px;
  border:none;
  border-radius:12px;
  background:#ff9966;
  color:white;
  font-size:16px;
  cursor:pointer;
}
</style>
</head>

<body>

<header>✍️ 笔顺练习系统</header>

<div id="info">
📚 当前汉字：<span id="name">猫</span>
</div>

<div class="card">

  <div class="char">
    <div id="stroke" class="stroke">猫</div>
    <div id="char">猫</div>
  </div>

  <button onclick="play()">▶ 播放写字动画</button>
  <button onclick="next()">下一个字 ➜</button>

</div>

<script>

const chars = ["猫","狗","鸟","人","大","小","中"];

let index = 0;

/* 初始化 */
function load(){
  document.getElementById("char").innerText = chars[index];
  document.getElementById("stroke").innerText = chars[index];
  document.getElementById("name").innerText = chars[index];
}

/* 🔊 语音 */
function play(){
  let msg = new SpeechSynthesisUtterance("写" + chars[index]);
  msg.lang = "zh-CN";
  speechSynthesis.speak(msg);

  // 重新触发动画
  let el = document.getElementById("stroke");
  el.style.animation = "none";
  void el.offsetWidth; 
  el.style.animation = "write 2s linear forwards";
}

/* 下一个字 */
function next(){
  index++;
  if(index >= chars.length){
    index = 0;
    alert("🎉 完成一轮练习！");
  }
  load();
}

load();

</script>

</body>
</html>
